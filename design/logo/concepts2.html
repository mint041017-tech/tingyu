<meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#1b221e;font-family:system-ui,"Segoe UI","PingFang SC",sans-serif;color:#e5ebde}
  .sheet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;padding:30px}
  .concept{padding:22px;border:1px solid #3d4940;border-radius:22px;background:#242d27}
  .concept h2{margin:0 0 16px;font-size:17px;font-weight:600}
  .dark-row{display:flex;align-items:flex-end;gap:18px;padding:18px;border-radius:16px;background:#1b221e}
  .light-row{display:flex;align-items:center;gap:18px;padding:18px;border-radius:16px;background:#f7f4ed;margin-top:12px}
  .big{width:180px;height:180px;flex:none}
  .mid{width:72px;height:72px;flex:none}
  .small{width:40px;height:40px;flex:none}
  .tiny{width:24px;height:24px;flex:none}
  svg{display:block;width:100%;height:100%}
  .lockup{display:flex;align-items:center;gap:20px;margin-top:14px;padding:22px;border-radius:16px;background:#1b221e}
  .lockup .mark{width:72px;height:72px}
  .lockup .word{font-size:42px;letter-spacing:10px;font-weight:600;color:#f4f1e8}
  .lockup .tag{font-size:11px;letter-spacing:5px;color:#a8b5a6;margin-top:4px}
  .wordmark-light{color:#35433e}
  .tag-light{color:#647066}
</style>
