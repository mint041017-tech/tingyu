<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#223027;color:#f4f1e8;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;-webkit-app-region:drag;user-select:none}
  .wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;position:relative}
  .glow{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(170,196,162,.18),rgba(170,196,162,0) 68%);filter:blur(4px);animation:glow 3.2s ease-in-out infinite}
  .mark{width:88px;height:88px;border-radius:28px;background:linear-gradient(135deg,#5d7a64,#4f6957 55%,#3c5345);box-shadow:inset 0 0 0 1px rgba(255,253,248,.12),0 16px 50px rgba(0,0,0,.28);display:grid;place-items:center;opacity:0;animation:markIn .8s cubic-bezier(.16,1,.3,1) .05s forwards;position:relative;z-index:1}
  .mark svg{width:62px;height:62px;overflow:visible}
  .leaf{transform-origin:50% 55%;animation:leafIn .9s cubic-bezier(.16,1,.3,1) .16s both}
  .vein{stroke-dasharray:210;stroke-dashoffset:210;animation:veinIn .9s cubic-bezier(.16,1,.3,1) .3s forwards}
  .dot{opacity:0;animation:dotIn .4s ease .72s forwards}
  .word{display:flex;flex-direction:column;align-items:center;gap:7px;opacity:0;animation:riseIn .7s cubic-bezier(.16,1,.3,1) .4s forwards;z-index:1}
  .word strong{font-size:30px;font-weight:600;letter-spacing:10px;padding-left:10px}
  .word span{font-size:10px;letter-spacing:5px;color:#a8b5a6;padding-left:5px}
  .bar{width:148px;height:2px;border-radius:2px;background:rgba(255,253,248,.12);overflow:hidden;opacity:0;animation:riseIn .5s ease .62s forwards}
  .bar::after{content:"";display:block;width:44%;height:100%;border-radius:inherit;background:#aac4a2;animation:slide 1.5s ease-in-out infinite}
  .hint{font-size:11px;letter-spacing:2px;color:#829887;opacity:0;animation:riseIn .5s ease .74s forwards}
  @keyframes markIn{from{opacity:0;transform:scale(.82) rotate(-4deg)}to{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes leafIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
  @keyframes veinIn{to{stroke-dashoffset:0}}
  @keyframes dotIn{to{opacity:.28}}
  @keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes slide{0%{transform:translateX(-110%)}50%{transform:translateX(120%)}100%{transform:translateX(240%)}}
  @keyframes glow{0%,100%{transform:scale(.92);opacity:.65}50%{transform:scale(1.06);opacity:1}}
  @media(prefers-reduced-motion:reduce){
    .mark,.word,.bar,.hint,.glow{animation:none!important;opacity:1!important;transform:none!important}
    .leaf,.dot{animation:none!important;opacity:1!important}
    .vein{animation:none!important;stroke-dashoffset:0!important}
    .bar::after{animation:none;width:100%}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="glow"></div>
    <div class="mark">
      <svg viewBox="0 0 1024 1024" aria-hidden="true">
        <g class="leaf">
          <path d="M512 184c154 96 220 240 176 390-30 104-112 178-176 218-64-40-146-114-176-218-44-150 22-294 176-390Z" fill="#fffdf8"/>
          <path class="vein" d="M512 268v452" stroke="#4f6957" stroke-width="18" stroke-linecap="round" opacity=".26" fill="none"/>
          <path class="vein" d="M420 456c54-34 134-38 194-10M404 558c62-36 146-38 212-8M424 658c48-28 116-30 172-4" stroke="#4f6957" stroke-width="30" stroke-linecap="round" fill="none"/>
          <circle class="dot" cx="512" cy="248" r="14" fill="#4f6957"/>
        </g>
      </svg>
    </div>
    <div class="word"><strong>听隅</strong><span>QUIET NOOK</span></div>
    <div class="bar"></div>
    <div class="hint">正在准备声音空间</div>
  </div>
</body>
</html>
