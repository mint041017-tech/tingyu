<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F7F4ED">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="听隅，让声音陪你专注、休息与放松。多轨混音、番茄钟、本地收藏与定时渐弱。">
  <title>听隅 · 给自己，留一小片安静</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/images/logo-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="听隅">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://obs.chimu-claw.xyz" crossorigin>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('tingyu.theme');
        const dark = saved === 'dark' || (saved !== 'light' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#191F1C' : '#F7F4ED';
      } catch (_) { /* 主题偏好不可用时沿用系统浅色。 */ }
    })();
  </script>
  <style>
    :root{--bg:#f7f4ed;--surface:#fffdf8;--text:#35433e;--muted:#647066;--accent:#4f6957;--on-accent:#fffdf8;--soft:#e8ece2;--border:#e0e3d9}
    :root[data-theme=dark]{--bg:#191f1c;--surface:#242d27;--text:#e5ebde;--muted:#a8b5a6;--accent:#aac4a2;--on-accent:#1e2b20;--soft:#354239;--border:#3d4940}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    #loading{position:fixed;inset:0;z-index:10;overflow:auto;background:var(--bg);opacity:1;transition:opacity .3s ease}
    #loading.leaving{opacity:0;pointer-events:none}
    .boot{width:min(100%,900px);margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom))}
    .top{display:flex;align-items:center;min-height:48px}
    .brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600;letter-spacing:1px;opacity:0;animation:brandIn .72s cubic-bezier(.16,1,.3,1) .04s forwards}
    .brand-mark{position:relative;display:grid;place-items:center;width:33px;height:33px;border-radius:11px;background:linear-gradient(135deg,#5d7a64,#4f6957 55%,#3c5345);box-shadow:inset 0 0 0 1px rgba(255,253,248,.12),0 2px 10px rgba(35,48,39,.18);overflow:hidden}
    .brand-mark svg{display:block;width:25px;height:25px;overflow:visible}
    .brand-mark .leaf{transform-origin:50% 55%;animation:leafIn .85s cubic-bezier(.16,1,.3,1) .08s both}
    .brand-mark .vein{stroke-dasharray:210;stroke-dashoffset:210;animation:veinIn .85s cubic-bezier(.16,1,.3,1) .22s forwards}
    .brand-mark .dot{opacity:0;animation:dotIn .4s ease .62s forwards}
    .boot-banner{display:grid;gap:11px;margin-top:18px;padding:14px 16px 13px;border:1px solid var(--border);border-radius:14px;background:var(--soft);opacity:0;animation:riseIn .55s cubic-bezier(.16,1,.3,1) .26s forwards}
    .boot-banner-copy{display:flex;align-items:center;gap:11px}
    .boot-spinner{flex:none;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
    .boot-banner strong{display:block;font-size:13px;line-height:1.5;font-weight:600;color:var(--text)}
    .boot-banner small{display:block;margin-top:2px;font-size:11px;line-height:1.6;color:var(--muted)}
    .boot-line{height:2px;overflow:hidden;border-radius:2px;background:var(--border)}
    .boot-line::after{content:"";display:block;width:38%;height:100%;border-radius:inherit;background:var(--accent);animation:settle 1.35s ease-in-out infinite}
    main{padding-top:22px}
    main>h1{opacity:0;animation:riseIn .6s cubic-bezier(.16,1,.3,1) .34s forwards}
    main>.sub{opacity:0;animation:riseIn .6s cubic-bezier(.16,1,.3,1) .4s forwards}
    h1{margin:0;font-size:25px;line-height:1.5;font-weight:500;letter-spacing:.3px}
    .sub{margin:7px 0 24px;font-size:13px;line-height:1.8;color:var(--muted)}
    .card{overflow:hidden;border:1px solid var(--border);border-radius:20px;background:var(--surface);opacity:0;animation:riseIn .65s cubic-bezier(.16,1,.3,1) .46s forwards}
    .art{background:linear-gradient(135deg,var(--soft),var(--surface))}
    .art img{display:block;width:100%;aspect-ratio:1.8;object-fit:cover}
    :root[data-theme=dark] .art img{filter:brightness(.76) saturate(.85)}
    .card-body{padding:18px 20px 20px}
    .title-row{display:flex;align-items:center;gap:18px}
    .title-copy{min-width:0;flex:1}
    h2{margin:0 0 6px;font-size:22px;line-height:1.3;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .status{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
    .boot-wait{flex:none;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--soft)}
    .boot-wait::before{content:"";width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}
    .tags span{padding:6px 10px;border-radius:8px;background:var(--soft);color:var(--muted);font-size:11px;line-height:1.25}
    .meta{display:flex;gap:26px;margin-top:17px;color:var(--muted);font-size:12px}
    @keyframes settle{from{transform:translateX(-110%)}to{transform:translateX(330%)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes brandIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
    @keyframes leafIn{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
    @keyframes veinIn{to{stroke-dashoffset:0}}
    @keyframes dotIn{to{opacity:.28}}
    @keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    #local-audio-file{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
    @media(min-width:850px){.boot{padding-top:28px}main{padding-top:28px}h1{font-size:30px}.card{max-width:820px}}
    @media(prefers-reduced-motion:reduce){
      #loading{transition:none}
      .brand,.boot-banner,main>h1,main>.sub,.card,.brand-mark .leaf,.brand-mark .dot{animation:none!important;opacity:1!important;transform:none!important}
      .brand-mark .vein{animation:none!important;stroke-dashoffset:0!important}
      .boot-line::after{animation:none;width:100%;opacity:.45}
      .boot-spinner,.boot-wait::before{animation:none;border-color:var(--accent);opacity:.55}
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="boot">
      <header class="top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 1024 1024" focusable="false">
              <g class="leaf">
                <path d="M512 184c154 96 220 240 176 390-30 104-112 178-176 218-64-40-146-114-176-218-44-150 22-294 176-390Z" fill="#fffdf8"/>
                <path class="vein" d="M512 268v452" stroke="#4f6957" stroke-width="18" stroke-linecap="round" opacity=".26" fill="none"/>
                <path class="vein" d="M420 456c54-34 134-38 194-10M404 558c62-36 146-38 212-8M424 658c48-28 116-30 172-4" stroke="#4f6957" stroke-width="30" stroke-linecap="round" fill="none"/>
                <circle class="dot" cx="512" cy="248" r="14" fill="#4f6957"/>
              </g>
            </svg>
          </span>听隅
        </div>
      </header>
      <div class="boot-banner" role="status" aria-live="polite">
        <div class="boot-banner-copy">
          <span class="boot-spinner" aria-hidden="true"></span>
          <div><strong>正在准备声音空间</strong><small>首次加载需要一点时间，之后会更快</small></div>
        </div>
        <div class="boot-line" aria-hidden="true"></div>
      </div>
      <main>
        <h1>给自己，留一小片安静。</h1>
        <p class="sub">把纷扰留在外面，把此刻留给自己。</p>
        <section class="card" aria-label="当前混音">
          <div class="art">
            <img src="assets/images/rain-nook-boot.webp" width="720" height="400" alt="雨落在窗外，窗边放着书和一杯茶的水彩画">
          </div>
          <div class="card-body">
            <div class="title-row">
              <div class="title-copy">
                <h2 id="boot-title">窗边一页</h2>
                <p class="status" id="boot-status">正在准备声音…</p>
              </div>
              <div class="boot-wait" aria-hidden="true"></div>
            </div>
            <div class="tags" id="boot-tags">
              <span>雨幕远雷</span><span>林间鸟鸣</span><span>棕色噪声</span>
            </div>
            <div class="meta"><span>定时关闭</span><span>3 种声音</span></div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <input id="local-audio-file" type="file" accept="audio/*,.wav,.mp3,.m4a,.ogg,.flac" tabindex="-1" aria-label="选择本地音频">
  <script src="audio-engine.js"></script>
  <script>
    (() => {
      const names = {
        rain: '雨幕远雷', rain_soft: '伞下雨声', rain_roof: '车顶落雨', forest: '林间鸟鸣',
        crickets: '田野蟋蟀', cicadas: '林野蝉鸣', frogs: '池畔蛙鸣', leaves: '风吹灌木',
        stream: '潺潺溪流', river: '河道流水', waterfall: '山间瀑布', ocean: '海浪与海鸟',
        wind: '草野之风', chimes: '风铃清音', underwater: '水下静域', bubbles: '近水气泡',
        cafe: '街角咖啡馆', train: '列车车厢', traffic: '桥上车流', fire: '枝火轻响',
        fireplace: '壁炉薪火', fan: '电扇低鸣', clock: '机械钟滴答', keyboard: '键盘慢敲',
        laundry: '洗衣机滚筒', white: '白噪声', pink: '粉红噪声', brown: '棕色噪声',
      };
      const title = document.getElementById('boot-title');
      const tags = document.getElementById('boot-tags');
      try {
        const draft = JSON.parse(localStorage.getItem('tingyu.draft') || 'null');
        if (draft && typeof draft.title === 'string' && draft.title.trim()) title.textContent = draft.title.trim().slice(0, 24);
        if (draft && Array.isArray(draft.tracks)) {
          const ids = [...new Set(draft.tracks.map(track => track && track.id).filter(id => typeof id === 'string'))].slice(0, 6);
          tags.replaceChildren(...ids.map(id => {
            const tag = document.createElement('span');
            tag.textContent = names[id] || (id.startsWith('local:') ? '本地声音' : '声音');
            return tag;
          }));
          if (!ids.length) {
            const tag = document.createElement('span');
            tag.textContent = '还没有声音';
            tags.replaceChildren(tag);
          }
        }
      } catch (_) { /* 草稿无效时保留默认展示。 */ }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const boot = document.getElementById('loading');
      if (!boot) return;
      boot.classList.add('leaving');
      setTimeout(() => boot.remove(), 240);
    }, { once: true });
  </script>
</body>
</html>
