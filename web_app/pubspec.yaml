name: tingyu_web
description: 听隅 Web：支持六轨混音、收藏与定时渐弱的白噪音声音空间。
publish_to: none
version: 2.0.0+20000

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  audio_session: ^0.2.4
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 18.0.1
  flutter_soloud: ^5.2.2
  flutter_timezone: ^5.1.1
  http: ^1.6.0
  local_notifier: 0.1.6
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  timezone: 0.9.4
  window_manager: ^0.5.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/audio/chime_bell.wav
    - assets/audio/chime_wood.wav
    - web/assets/images/rain-nook.webp
    - web/assets/audio/manifest.json
    - assets/fonts/nook.ttf
  fonts:
    - family: NookUI
      fonts:
        - asset: assets/fonts/nook-ui.ttf
